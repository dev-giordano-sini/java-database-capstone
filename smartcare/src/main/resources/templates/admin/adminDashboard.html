<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin workspace · SmartCare</title>
    <link rel="stylesheet" th:href="@{/assets/css/smartcare.css}">
    <script type="module" th:src="@{/js/smartcare/dashboard.js}" defer></script>
</head>
<body data-page="admin">
<div class="page-shell dashboard-shell">
    <header th:replace="~{fragments/layout :: header('admin')}"></header>
    <main class="dashboard">
        <aside class="dashboard-sidebar">
            <span class="eyebrow">Administration</span><h1>Clinical team</h1>
            <p>Add doctors, review their specialties, and keep the directory accurate.</p>
            <button class="button button-primary button-block" data-open-doctor-form>+ Add doctor</button>
        </aside>
        <section class="dashboard-content">
            <div class="dashboard-toolbar">
                <div><span class="eyebrow">Directory</span><h2>Doctors</h2></div>
                <label class="search-field"><span>Search</span><input type="search" placeholder="Name or specialty" data-doctor-search></label>
            </div>
            <div class="metric-row">
                <article class="metric"><span>Total doctors</span><strong data-doctor-count>—</strong></article>
                <article class="metric"><span>Specialties</span><strong data-specialty-count>—</strong></article>
                <article class="metric"><span>Directory status</span><strong class="metric-good">Active</strong></article>
            </div>
            <div class="card-grid compact-grid" data-admin-doctors><article class="skeleton-card"></article></div>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<dialog class="signup-dialog" data-doctor-dialog>
    <button class="dialog-close" data-dialog-close type="button">×</button>
    <span class="eyebrow">New team member</span><h2>Add a doctor</h2>
    <form data-doctor-form>
        <div class="form-grid">
            <label>Full name<input name="name" required minlength="3"></label>
            <label>Specialty<input name="specialty" required minlength="3"></label>
            <label>Email<input name="email" type="email" required></label>
            <label>Temporary password<input name="password" type="password" minlength="6" required></label>
            <label>Phone<input name="phone" pattern="[0-9]{10}" required></label>
            <label>Rating<input name="rating" type="number" min="0" max="5" value="0" required></label>
            <label class="full-field">Available times <small>Comma separated, e.g. 09:00, 10:00</small><input name="availableTimes" value="09:00, 10:00, 14:00" required></label>
        </div>
        <p class="form-error" data-doctor-error hidden></p>
        <button class="button button-primary button-block">Save doctor</button>
    </form>
</dialog>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body></html>
