<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header(active)">
    <a class="brand" th:href="@{/}" aria-label="SmartCare home">
        <span class="brand-mark">S</span>
        <span>SmartCare</span>
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? ' active'">Home</a>
        <a href="/#doctors">Doctors</a>
        <a href="/#about">About</a>
    </nav>
    <div class="header-actions">
        <span class="session-role" data-session-role hidden></span>
        <button class="button button-ghost" type="button" data-logout hidden>Log out</button>
        <a class="button button-primary" th:href="@{/#access}" data-login-link>Access portal</a>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div>
        <a class="brand brand-footer" th:href="@{/}"><span class="brand-mark">S</span>SmartCare</a>
        <p>Clear scheduling for better care.</p>
    </div>
    <div class="footer-meta">
        <span>Educational portfolio project</span>
        <span>Java · Spring Boot · Thymeleaf</span>
    </div>
</footer>

<div class="toast-region" aria-live="polite" aria-atomic="true" th:fragment="toasts">
    <div class="toast" data-toast hidden></div>
</div>
</body>
</html>
