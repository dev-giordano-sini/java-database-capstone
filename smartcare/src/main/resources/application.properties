spring.application.name=smartcare
server.port=8080
server.address=0.0.0.0
spring.devtools.restart.enabled=false
spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcare}
spring.datasource.username=${DB_USERNAME:smartcare}
spring.datasource.password=${DB_PASSWORD:smartcare}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

api.path=/api/

# Local-only defaults let the application start from an IDE without unresolved
# placeholders. Docker/production deployments must override these values.
jwt.secret-key=${JWT_SECRET:c21hcnRjYXJlLWxvY2FsLWRldmVsb3BtZW50LWtleSE=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

app.bootstrap-admin.username=${ADMIN_USERNAME:local-admin}
app.bootstrap-admin.password=${ADMIN_PASSWORD:local-admin-change-me}
