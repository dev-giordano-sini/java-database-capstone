spring.application.name=smartcare
server.port=8080
spring.devtools.restart.enabled=false
spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcare}
spring.datasource.username=${DB_USERNAME:smartcare}
spring.datasource.password=${DB_PASSWORD:smartcare}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

api.path=/api/

jwt.secret-key=${JWT_SECRET:5367566859703373367639792F423F452848284D6251655468576D5A71347437}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
