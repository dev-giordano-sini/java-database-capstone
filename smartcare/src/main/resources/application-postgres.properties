# PostgreSQL profile used by Docker Compose and production-like local runs.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcare}
spring.datasource.username=${DB_USERNAME:smartcare}
spring.datasource.password=${DB_PASSWORD:smartcare}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
