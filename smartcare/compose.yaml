services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartcare
      POSTGRES_USER: smartcare
      POSTGRES_PASSWORD: smartcare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcare -d smartcare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - smartcare-data:/var/lib/postgresql/data

  application:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/smartcare
      DB_USERNAME: smartcare
      DB_PASSWORD: smartcare
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a Base64-encoded 256-bit key}
      JPA_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  smartcare-data:
