services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartcare
      POSTGRES_USER: smartcare
      POSTGRES_PASSWORD: smartcare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcare -d smartcare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - smartcare-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  application:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/smartcare
      DB_USERNAME: smartcare
      DB_PASSWORD: smartcare
      JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET:-c21hcnRjYXJlLWxvY2FsLWRldmVsb3BtZW50LWtleSE=}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-local-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-change-me}
      JPA_DDL_AUTO: validate
    ports:
      - "8080:8080"

volumes:
  smartcare-data:
