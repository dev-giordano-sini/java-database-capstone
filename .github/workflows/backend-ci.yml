name: Backend CI

on:
  push:
    paths:
      - "smartcare/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "smartcare/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartcare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress clean verify
